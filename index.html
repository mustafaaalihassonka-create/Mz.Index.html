<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07070a">
<title>MZVERSE | Mustafa</title>
<style>
:root{--bg:#07070a;--card:#101016;--line:#ffffff18;--red:#e51b4d;--gold:#d8b15a;--muted:#a7a7ad}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 5%,#8b18351f,transparent 32%),radial-gradient(circle at 0 75%,#27365c20,transparent 30%),radial-gradient(circle at 100% 60%,#e51b4d12,transparent 28%)}
.grid{position:fixed;inset:0;z-index:-1;opacity:.12;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:45px 45px;mask-image:linear-gradient(to bottom,black,transparent 75%)}
.wrap{width:min(650px,92%);margin:auto;padding:34px 0 35px}.hero{text-align:center}
.logo{width:105px;height:105px;margin:auto;border:1px solid var(--line);border-radius:31px;background:linear-gradient(145deg,#19191f,#09090c);display:grid;place-items:center;box-shadow:0 0 60px #e51b4d20,inset 0 1px #fff3;animation:float 4s ease-in-out infinite}
.logo span{font-size:31px;font-weight:1000;letter-spacing:-5px}.logo b{color:var(--red)}
@keyframes float{50%{transform:translateY(-5px)}}h1{font-size:44px;letter-spacing:6px;margin:19px 0 2px;font-weight:950}.tag{font-size:12px;letter-spacing:3px;color:#aaa}.bio{color:#ddd;line-height:1.8;margin:18px auto 28px}
.socials{display:grid;gap:13px}.card{position:relative;display:flex;align-items:center;gap:15px;text-decoration:none;color:#fff;padding:16px;border:1px solid var(--line);border-radius:22px;background:#ffffff08;backdrop-filter:blur(12px);transition:.22s;overflow:hidden}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,#ffffff08,transparent);transform:translateX(-100%);transition:.5s}.card:hover{transform:translateY(-3px);border-color:#ffffff30;background:#ffffff0d}.card:hover:after{transform:translateX(100%)}
.ico{width:48px;height:48px;flex:0 0 48px;border-radius:15px;display:grid;place-items:center;background:#17171d;font-weight:950;font-size:20px}.txt{flex:1;text-align:right}.txt strong{display:block;font-size:16px}.txt small{color:var(--muted);font-size:12px}.arrow{color:#777;font-size:23px}
.section{font-size:11px;letter-spacing:3px;color:#777;text-align:center;margin:28px 0 12px}.footer{text-align:center;color:#555;font-size:10px;letter-spacing:2px;margin-top:28px}
.music{position:fixed;right:17px;bottom:17px;width:52px;height:52px;border:1px solid #fff2;border-radius:50%;background:#111;color:#fff;font-size:20px;box-shadow:0 8px 30px #0008;cursor:pointer}
@media(max-width:430px){h1{font-size:36px;letter-spacing:4px}.wrap{padding-top:27px}}
</style>
</head>
<body><div class="grid"></div>
<main class="wrap">
<section class="hero">
<div class="logo"><span>M<b>Z</b></span></div>
<h1>MZVERSE</h1>
<div class="tag">WELCOME TO MY WORLD</div>
<p class="bio">حساباتي، محتواي، وعالمي الخاص<br>كلشي بمكان واحد.</p>
</section>

<div class="section">MY SOCIALS</div>
<section class="socials">
<a class="card" href="https://www.instagram.com/0_5mu/" target="_blank" rel="noopener"><div class="ico">◎</div><div class="txt"><strong>Instagram</strong><small>@0_5mu</small></div><div class="arrow">‹</div></a>
<a class="card" href="https://www.tiktok.com/@_mu_66" target="_blank" rel="noopener"><div class="ico">♪</div><div class="txt"><strong>TikTok</strong><small>@_mu_66</small></div><div class="arrow">‹</div></a>
<a class="card" href="https://www.facebook.com/share/1CKbQk8Pmq/" target="_blank" rel="noopener"><div class="ico">f</div><div class="txt"><strong>Facebook</strong><small>Mustafa Ali</small></div><div class="arrow">‹</div></a>
<a class="card" href="https://t.me/soof0" target="_blank" rel="noopener"><div class="ico">✈</div><div class="txt"><strong>Telegram</strong><small>@soof0</small></div><div class="arrow">‹</div></a>
<!-- لإضافة حساب: انسخ أي بطاقة card وعدّل الاسم والرابط -->
</section>
<div class="footer">MZVERSE • ONE WORLD, MANY SIDES</div>
</main>
<button class="music" onclick="toggleMusic()" aria-label="تشغيل الموسيقى">♫</button>
<audio id="audio" loop preload="none" src="music.mp3"></audio>
<script>
function toggleMusic(){const a=document.getElementById('audio');a.play().catch(()=>alert('ضع ملف الموسيقى باسم music.mp3 داخل نفس مجلد الموقع.'));if(!a.paused)a.pause();}
</script>
</body></html>
